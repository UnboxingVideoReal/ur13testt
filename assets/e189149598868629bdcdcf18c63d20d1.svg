<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="252.40348" height="214.86594" viewBox="0,0,252.40348,214.86594"><g transform="translate(-113.79826,-72.56703)"><g stroke-miterlimit="10"><path d="M116.29826,284.93297v-209.86594h247.40348v209.86594z" fill-opacity="0.35294" fill="#000000" stroke="#ffffff" stroke-width="5"/><text transform="translate(128.78769,121.37964) scale(0.21689,0.21689)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- small graphics update to rooms with stars and moons</tspan><tspan x="0" dy="48px">- added item select. you can only select the lantern </tspan><tspan x="0" dy="48px">  if your highest room is past 500.</tspan><tspan x="0" dy="48px">- fixed the mobile support for the heart minigame</tspan><tspan x="0" dy="48px">  showing up after you close the guidebook.</tspan><tspan x="0" dy="48px">- you can now save, load, and reset data in the menu</tspan><tspan x="0" dy="48px">  and death screen.</tspan></text><text transform="translate(201.57954,266.16771) scale(0.26911,0.26911)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">&lt; 1.3.0 - 1.3.1 &gt;</tspan></text><text transform="translate(145.69677,102.36849) scale(0.44224,0.44224)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">1.3.0 - renovation pt. 3</tspan></text></g></g></svg>