<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="252.40348" height="214.86594" viewBox="0,0,252.40348,214.86594"><g transform="translate(-113.79826,-72.56703)"><g stroke-miterlimit="10"><path d="M116.29826,284.93297v-209.86594h247.40348v209.86594z" fill-opacity="0.35294" fill="#000000" stroke="#ffffff" stroke-width="5"/><text transform="translate(128.78769,121.37964) scale(0.21689,0.21689)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">- nerfed a-25, louder spawn cue</tspan><tspan x="0" dy="48px">- nerfed a-500</tspan><tspan x="0" dy="48px">  - a-700 can still spawn but fires do less damage and</tspan><tspan x="0" dy="48px">    it can no longer rush during a-500's stuff</tspan><tspan x="0" dy="48px">  - a-180 can now spawn during a-500</tspan><tspan x="0" dy="48px">  - can no longer spawn at any time after 501</tspan><tspan x="0" dy="48px">- brightened c section</tspan><tspan x="0" dy="48px">- fixed a-935</tspan><tspan x="0" dy="48px">- revamped a few entities:</tspan><tspan x="0" dy="48px">  - a-360</tspan><tspan x="0" dy="48px">  - a-470</tspan><tspan x="0" dy="48px">  - a-545 (now a-550)</tspan><tspan x="0" dy="48px">  - a-935 (now a-940)</tspan><tspan x="0" dy="48px">  - a-1060</tspan></text><text transform="translate(202.27224,266.16771) scale(0.26911,0.26911)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">&lt; 1.3.1 - 1.3.1&gt;</tspan></text><text transform="translate(160.64311,102.36849) scale(0.44224,0.44224)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">1.3.1 - final update</tspan></text></g></g></svg>